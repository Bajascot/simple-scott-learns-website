  <style>
    /* ── Timeline-specific styles ── */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 80px 1px 1fr;
      gap: 0 24px;
      position: relative;
    }

    /* Year label */
    .timeline-year {
      text-align: right;
      padding-top: 28px;
    }
    .timeline-year span {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 400;
    }

    /* Vertical line + dot */
    .timeline-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--accent);
      margin-top: 32px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .timeline-line {
      width: 1px;
      flex: 1;
      background: var(--cloud);
      margin-top: 4px;
    }
    .timeline-item:last-child .timeline-line {
      display: none;
    }

    /* Card */
    .timeline-card {
      margin: 16px 0 32px;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      border: 1px solid var(--cloud);
      box-shadow: var(--shadow-sm);
      cursor: default;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
    }
    .timeline-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--accent-lt);
    }

    .timeline-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .timeline-company {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--navy);
      line-height: 1.2;
    }
    .timeline-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .timeline-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--slate);
    }
    .timeline-location {
      font-size: 0.8rem;
      color: var(--mist);
    }
    .timeline-location::before {
      content: '·';
      margin-right: 8px;
    }

    .timeline-dates {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--accent-lt);
      border-radius: 999px;
      padding: 3px 12px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .timeline-summary {
      margin-top: 14px;
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    /* No results state */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .no-results h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--slate);
    }
    .clear-filter {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: var(--accent);
      color: var(--white);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .clear-filter:hover { opacity: 0.85; }

    /* Active filter banner */
    .filter-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-lt);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 500;
    }
    .filter-banner.visible { display: flex; }
    .filter-banner button {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 4px;
    }
  </style>
</head>

  <!-- Page Header -->
  <header class="page-header">
    <p class="section-label">Career history</p>
    <h1>Timeline</h1>
    <p>A chronological view of my professional journey, from earliest to most recent.</p>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    <main class="main-content" id="main">

      <!-- Active filter banner -->
      <div class="filter-banner" id="filter-banner">
        Showing entries tagged: <strong id="active-tag-label"></strong>
        <button onclick="clearFilter()" aria-label="Clear filter">×</button>
      </div>

      <!-- Timeline list -->
      <div class="timeline" id="timeline-list" aria-live="polite"></div>

    </main>

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Tag filter">
      <div class="sidebar-card">
        <h3>Browse by tag</h3>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>
    </aside>
  </div>

  <!-- Data + logic -->
  <script src="data/jobs.js"></script>
  <script>
    let activeTag = null;

    function renderTimeline(jobs) {
      const list = document.getElementById('timeline-list');
      if (!jobs.length) {
        list.innerHTML = `
          <div class="no-results">
            <h3>No entries found</h3>
            <p>No jobs match the tag "<strong>${activeTag}</strong>".</p>
            <button class="clear-filter" onclick="clearFilter()">Clear filter</button>
          </div>`;
        return;
      }
      list.innerHTML = jobs.map(job => `
        <div class="timeline-item" data-id="${job.id}">
          <div class="timeline-year">
            <span>${job.startYear}</span>
          </div>
          <div class="timeline-spine">
            <div class="timeline-dot"></div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-card">
            <div class="timeline-card-header">
              <div>
                <div class="timeline-company">${job.company}</div>
                <div class="timeline-meta">
                  <span class="timeline-title">${job.title}</span>
                  <span class="timeline-location">${job.location}</span>
                </div>
              </div>
              <div class="timeline-dates">
                ${job.startYear} – ${job.endYear || 'Present'}
              </div>
            </div>
            <p class="timeline-summary">${job.summary}</p>
            <div class="card-tags">
              ${job.tags.map(t => `<span class="tag${t === activeTag ? ' active' : ''}" onclick="setFilter('${t}')">${t}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderTagCloud() {
      const cloud = document.getElementById('tag-cloud');
      const tags = getAllTags();
      cloud.innerHTML = tags.map(({ tag, count }) => `
        <span class="tag${tag === activeTag ? ' active' : ''}" onclick="setFilter('${tag}')">
          ${tag}<span class="tag-count">${count}</span>
        </span>
      `).join('');
    }

    function setFilter(tag) {
      activeTag = (activeTag === tag) ? null : tag;
      applyFilter();
    }

    function clearFilter() {
      activeTag = null;
      applyFilter();
    }

    function applyFilter() {
      const banner = document.getElementById('filter-banner');
      const label  = document.getElementById('active-tag-label');
      if (activeTag) {
        banner.classList.add('visible');
        label.textContent = activeTag;
      } else {
        banner.classList.remove('visible');
      }
      renderTimeline(filterByTag(activeTag));
      renderTagCloud();
    }

    // Init
    renderTimeline(JOBS);
    renderTagCloud();
  </script>
