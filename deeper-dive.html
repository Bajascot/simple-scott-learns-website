  <style>
    /* ── Deeper Dive specific styles ── */
    .jobs-list {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Job block */
    .job-block {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid #2a3750;
      box-shadow: var(--shadow-sm);
    }

    .job-header {
      background: #0f1f3d;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .job-header-left h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: #e8edf5;
      line-height: 1.2;
    }
    .job-header-left .job-top-title {
      font-size: 0.875rem;
      color: #566880;
      margin-top: 4px;
      font-weight: 300;
    }
    .job-header-right {
      text-align: right;
    }
    .job-years {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(200,151,58,0.3);
      letter-spacing: 0.04em;
    }
    .job-location {
      font-size: 0.8rem;
      color: #566880;
      margin-top: 2px;
    }

    .job-summary {
      background: #e8edf5;
      padding: 20px 32px;
      border-bottom: 1px solid #1a2235;
      font-size: 0.92rem;
      color: #9aaabf;
      line-height: 1.65;
    }

    /* Progressions */
    .progressions {
      background: #e8edf5;
      padding: 8px 32px 32px;
    }

    .progression-item {
      display: grid;
      grid-template-columns: 1px 1fr;
      gap: 0 28px;
      position: relative;
      margin-top: 28px;
    }

    .progression-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .progression-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c8973a;
      flex-shrink: 0;
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }
    .progression-line {
      width: 1px;
      flex: 1;
      background: #2a3750;
      margin-top: 6px;
      min-height: 20px;
    }
    .progression-item:last-child .progression-line {
      display: none;
    }

    .progression-body {}

    .progression-period {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .progression-dates {
      font-size: 0.78rem;
      font-weight: 600;
      color: #c8973a;
      background: rgba(200,151,58,0.1);
      border: 1px solid rgba(200,151,58,0.3);
      border-radius: 999px;
      padding: 2px 10px;
      letter-spacing: 0.03em;
    }

    .progression-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: #e8edf5;
    }

    .progression-description {
      font-size: 0.9rem;
      color: #c8d6e8;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    /* No results */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #566880;
    }
    .no-results h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #9aaabf;
    }
    .clear-filter {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: #c8973a;
      color: #e8edf5;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .clear-filter:hover { opacity: 0.85; }

    /* Active filter banner */
    .filter-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(200,151,58,0.1);
      border: 1px solid rgba(200,151,58,0.3);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: #c8973a;
      font-weight: 500;
    }
    .filter-banner.visible { display: flex; }
    .filter-banner button {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #c8973a;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 4px;
    }
  </style>
</head>

  <!-- Page Header -->
  <header class="page-header">
    <p class="section-label">Career detail</p>
    <h1>Deeper Dive</h1>
    <p>A closer look at each role — what I did, how I grew, and what I learned along the way.</p>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    <main class="main-content" id="main">

      <!-- Active filter banner -->
      <div class="filter-banner" id="filter-banner">
        Showing entries tagged: <strong id="active-tag-label"></strong>
        <button onclick="clearFilter()" aria-label="Clear filter">×</button>
      </div>

      <!-- Jobs list -->
      <div class="jobs-list" id="jobs-list" aria-live="polite"></div>

    </main>

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Tag filter">
      <div class="sidebar-card">
        <h3>Browse by tag</h3>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>
    </aside>
  </div>

  <!-- Data + logic -->
  <script src="data/jobs.js"></script>
  <script>
    let activeTag = null;

    function renderJobs(jobs) {
      const list = document.getElementById('jobs-list');
      if (!jobs.length) {
        list.innerHTML = `
          <div class="no-results">
            <h3>No entries found</h3>
            <p>No roles match the tag "<strong>${activeTag}</strong>".</p>
            <button class="clear-filter" onclick="clearFilter()">Clear filter</button>
          </div>`;
        return;
      }
      list.innerHTML = jobs.map(job => `
        <div class="job-block" id="${job.id}">
          <div class="job-header">
            <div class="job-header-left">
              <h2>${job.company}</h2>
              <div class="job-top-title">${job.title}</div>
            </div>
            <div class="job-header-right">
              <div class="job-years">${job.startYear} – ${job.endYear || 'Present'}</div>
              <div class="job-location">${job.location}</div>
            </div>
          </div>
          <div class="job-summary">${job.summary}</div>
          <div class="progressions">
            ${job.progressions.map(p => `
              <div class="progression-item">
                <div class="progression-spine">
                  <div class="progression-dot"></div>
                  <div class="progression-line"></div>
                </div>
                <div class="progression-body">
                  <div class="progression-period">
                    <span class="progression-dates">${p.start} – ${p.end}</span>
                    <span class="progression-title">${p.title}</span>
                  </div>
                  <p class="progression-description">${p.description}</p>
                  <div class="card-tags">
                    ${p.tags.map(t => `<span class="tag${t === activeTag ? ' active' : ''}" onclick="setFilter('${t}')">${t}</span>`).join('')}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderTagCloud() {
      const cloud = document.getElementById('tag-cloud');
      // Only count tags from progressions (not top-level job tags)
      const counts = {};
      JOBS.forEach(job => {
        job.progressions.forEach(p => {
          p.tags.forEach(tag => {
            counts[tag] = (counts[tag] || 0) + 1;
          });
        });
      });
      const tags = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([tag, count]) => ({ tag, count }));
      cloud.innerHTML = tags.map(({ tag, count }) => `
        <span class="tag${tag === activeTag ? ' active' : ''}" onclick="setFilter('${tag}')">
          ${tag}<span class="tag-count">${count}</span>
        </span>
      `).join('');
    }

    function setFilter(tag) {
      activeTag = (activeTag === tag) ? null : tag;
      applyFilter();
    }

    function clearFilter() {
      activeTag = null;
      applyFilter();
    }

    function applyFilter() {
      const banner = document.getElementById('filter-banner');
      const label  = document.getElementById('active-tag-label');
      if (activeTag) {
        banner.classList.add('visible');
        label.textContent = activeTag;
      } else {
        banner.classList.remove('visible');
      }
      renderJobs([...filterByTag(activeTag)].reverse());
      renderTagCloud();
    }

    // Init — newest first (resume order)
    renderJobs([...JOBS].reverse());
    renderTagCloud();
  </script>
