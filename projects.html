  <style>
    .section-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      margin-top: 8px;
    }
    .section-heading h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--navy);
    }
    .section-heading-line {
      flex: 1;
      height: 1px;
      background: var(--cloud);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 48px;
    }

    .project-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      border: 1px solid var(--cloud);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
    }
    .project-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--accent-lt);
    }

    .project-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--navy);
      line-height: 1.25;
    }

    .project-status {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .status-completed {
      background: #eaf3de;
      color: #3b6d11;
      border: 1px solid #c0dd97;
    }
    .status-in-progress {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent-lt);
    }

    .project-year {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .project-summary {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.65;
      flex: 1;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 4px;
      transition: gap 0.15s;
    }
    .project-link:hover { gap: 8px; }

    /* No results */
    .no-results {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .no-results h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--slate);
      margin-bottom: 6px;
    }

    /* Filter banner */
    .filter-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-lt);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 500;
    }
    .filter-banner.visible { display: flex; }
    .filter-banner button {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 4px;
    }

    @media (max-width: 600px) {
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <!-- Page Header -->
  <header class="page-header">
    <p class="section-label">What I've built</p>
    <h1>Projects</h1>
    <p>Professional initiatives and personal builds — completed and in progress.</p>
  </header>

  <!-- Layout -->
  <div class="layout">
    <main class="main-content">

      <div class="filter-banner" id="filter-banner">
        Showing projects tagged: <strong id="active-tag-label"></strong>
        <button onclick="clearFilter()" aria-label="Clear filter">×</button>
      </div>

      <!-- Professional -->
      <div class="section-heading">
        <p class="section-label" style="margin:0">Professional</p>
        <div class="section-heading-line"></div>
      </div>
      <div class="projects-grid" id="pro-grid" aria-live="polite"></div>

      <!-- Personal -->
      <div class="section-heading">
        <p class="section-label" style="margin:0">Personal</p>
        <div class="section-heading-line"></div>
      </div>
      <div class="projects-grid" id="personal-grid" aria-live="polite"></div>

    </main>

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Tag filter">
      <div class="sidebar-card">
        <h3>Browse by tag</h3>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>
    </aside>
  </div>

  <script src="data/projects.js"></script>
  <script>
    let activeTag = null;

    function statusClass(s) {
      return s === 'completed' ? 'status-completed' : 'status-in-progress';
    }
    function statusLabel(s) {
      return s === 'completed' ? 'Completed' : 'In progress';
    }

    function projectCard(p) {
      return `
        <div class="project-card">
          <div class="project-card-top">
            <div class="project-title">${p.title}</div>
            <span class="project-status ${statusClass(p.status)}">${statusLabel(p.status)}</span>
          </div>
          <div class="project-year">${p.year}</div>
          <p class="project-summary">${p.summary}</p>
          <div class="card-tags">
            ${p.tags.map(t => `<span class="tag${t === activeTag ? ' active' : ''}" onclick="setFilter('${t}')">${t}</span>`).join('')}
          </div>
          ${p.link ? `<a href="${p.link}" class="project-link" target="_blank" rel="noopener">View project <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>` : ''}
        </div>`;
    }

    function emptyState(type) {
      return `<div class="no-results"><h3>No ${type} projects match this tag</h3></div>`;
    }

    function renderProjects(projects) {
      const pro      = projects.filter(p => p.type === 'professional');
      const personal = projects.filter(p => p.type === 'personal');
      document.getElementById('pro-grid').innerHTML      = pro.length      ? pro.map(projectCard).join('')      : emptyState('professional');
      document.getElementById('personal-grid').innerHTML = personal.length ? personal.map(projectCard).join('') : emptyState('personal');
    }

    function renderTagCloud() {
      const cloud = document.getElementById('tag-cloud');
      const tags  = getAllProjectTags();
      cloud.innerHTML = tags.map(({ tag, count }) => `
        <span class="tag${tag === activeTag ? ' active' : ''}" onclick="setFilter('${tag}')">
          ${tag}<span class="tag-count">${count}</span>
        </span>
      `).join('');
    }

    function setFilter(tag) {
      activeTag = (activeTag === tag) ? null : tag;
      applyFilter();
    }

    function clearFilter() {
      activeTag = null;
      applyFilter();
    }

    function applyFilter() {
      const banner = document.getElementById('filter-banner');
      const label  = document.getElementById('active-tag-label');
      if (activeTag) {
        banner.classList.add('visible');
        label.textContent = activeTag;
      } else {
        banner.classList.remove('visible');
      }
      renderProjects(filterProjectsByTag(activeTag));
      renderTagCloud();
    }

    renderProjects(PROJECTS);
    renderTagCloud();
  </script>
